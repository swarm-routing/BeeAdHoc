name: Core

# BeeAdHoc's simulator-free core/ on its own (plain CMake + ctest, no ns-3
# tree), with the org's quality gates for C++: strict warnings as errors (in
# core/CMakeLists.txt), the tests under ASan + UBSan, and clang-format with the
# org .clang-format. swarm-core's primitives come from its vcpkg port
# (swarm-routing/.github#489): vcpkg.json pins the version swarm-core.lock
# names, vcpkg-configuration.json the swarm-routing/vcpkg-registry baseline,
# and swarm-routing/.github's setup-vcpkg action gives the tool (its binary
# cache on GitHub Packages is off here, see the step). ns3.yml builds the same
# sources inside ns-3 on the lock's tag. The check name is `core`.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

# A newer push to the same pull request cancels this run (swarm-routing/.github#505):
# runners are shared by the whole org. Pushes, merge groups and dispatches run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      # a docs-only change skips the steps below; the check still reports (swarm-routing/.github#581)
      - uses: swarm-routing/.github/.github/actions/changes@2d2c557c2d25e899fb487edd599056096b218d3f # main@2026-11-22
        id: changes
        timeout-minutes: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.docs-only != 'true'
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.docs-only != 'true'
        with:
          repository: swarm-routing/.github
          path: .org
          sparse-checkout: |
            .clang-format
            .clang-tidy
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: vcpkg (swarm-routing/.github#489)
        if: steps.changes.outputs.docs-only != 'true'
        id: vcpkg
        uses: swarm-routing/.github/.github/actions/setup-vcpkg@2d2c557c2d25e899fb487edd599056096b218d3f # main@2026-11-22
        timeout-minutes: 8
        with:
          # The NuGet cache needs mono on the runner (28-50 s to install); the
          # three ports it would restore build in about 5 s, so here it costs
          # more than it saves (measured on swarm-routing/ARA#176,
          # swarm-routing/.github#489). Turn it on when the ports grow.
          binary-cache: 'off'
      # one vcpkg_installed for every configure below: the port is installed once
      - name: Build and test (debug, strict warnings; swarm-core from its vcpkg port)
        if: steps.changes.outputs.docs-only != 'true'
        env:
          TOOLCHAIN: ${{ steps.vcpkg.outputs.toolchain }}
        run: |
          cmake -S core -B build/debug -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DVCPKG_INSTALLED_DIR="$PWD/build/vcpkg_installed"
          cmake --build build/debug -j "$(nproc)"
          ctest --test-dir build/debug --output-on-failure
      - name: clang-tidy (org .clang-tidy, findings are errors; core/ sources, tests excluded; swarm-routing/.github#635)
        if: steps.changes.outputs.docs-only != 'true'
        timeout-minutes: 5
        run: |
          git ls-files 'core/*.cc' ':!core/test/**' | xargs clang-tidy-18 -p build/debug --config-file=.org/.clang-tidy --warnings-as-errors='*' --header-filter="^$PWD/core/[^/]+\.h$" --quiet
      - name: Build and test (ASan + UBSan; BeeAdHoc instrumented, swarm-core the port as published)
        if: steps.changes.outputs.docs-only != 'true'
        env:
          TOOLCHAIN: ${{ steps.vcpkg.outputs.toolchain }}
        run: |
          cmake -S core -B build/sanitized -DCMAKE_BUILD_TYPE=Debug -DBEEADHOC_CORE_SANITIZE=ON \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DVCPKG_INSTALLED_DIR="$PWD/build/vcpkg_installed"
          cmake --build build/sanitized -j "$(nproc)"
          ctest --test-dir build/sanitized --output-on-failure
      - name: The CMake package beeadhoc-core (find_package, on the swarm-core port; swarm-routing/.github#436)
        if: steps.changes.outputs.docs-only != 'true'
        env:
          TOOLCHAIN: ${{ steps.vcpkg.outputs.toolchain }}
        run: |
          prefix="$PWD/build/prefix"
          installed="$PWD/build/vcpkg_installed"
          cmake -S core -B build/pkg -DCMAKE_BUILD_TYPE=Release -DBEEADHOC_CORE_INSTALL=ON -DBEEADHOC_CORE_TESTS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DVCPKG_INSTALLED_DIR="$installed"
          cmake --build build/pkg -j "$(nproc)" && cmake --install build/pkg --prefix "$prefix"
          for f in lib/libbeeadhoc_core.a lib/cmake/beeadhoc-core/beeadhoc-coreConfig.cmake lib/cmake/beeadhoc-core/beeadhoc-coreConfigVersion.cmake lib/cmake/beeadhoc-core/beeadhoc-coreTargets.cmake; do
            test -f "$prefix/$f" || { echo "::error::the install has no $f"; exit 1; }
          done
          cmake -S core/test/consumer-package -B build/consumer -DCMAKE_PREFIX_PATH="$prefix;$installed/x64-linux"
          cmake --build build/consumer && build/consumer/consumer
      - name: Format (org .clang-format)
        if: steps.changes.outputs.docs-only != 'true'
        run: git ls-files 'core/*.h' 'core/*.cc' | xargs clang-format-18 --style=file:.org/.clang-format --dry-run --Werror
