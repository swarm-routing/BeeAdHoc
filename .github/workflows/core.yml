name: Core

# BeeAdHoc's simulator-free core/ on its own (plain CMake + ctest, no ns-3
# tree), with the org's quality gates for C++: strict warnings as errors (in
# core/CMakeLists.txt), the tests under ASan + UBSan, and clang-format with the
# org .clang-format. swarm-core's primitives come from the commit
# core/CMakeLists.txt pins. Once ns3/ exists, reusable-ns3-ci.yml builds the
# same sources inside ns-3 as well. The check name is `core`.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  core:
    name: core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swarm-routing/.github
          path: .org
          sparse-checkout: .clang-format
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Build and test (debug, strict warnings)
        run: |
          cmake -S core -B build/debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/debug -j "$(nproc)"
          ctest --test-dir build/debug --output-on-failure
      - name: Build and test (ASan + UBSan)
        run: |
          cmake -S core -B build/sanitized -DCMAKE_BUILD_TYPE=Debug -DBEEADHOC_CORE_SANITIZE=ON \
            -DSWARM_CORE_DIR="$PWD/build/debug/_deps/swarm_core_src-src/core"
          cmake --build build/sanitized -j "$(nproc)"
          ctest --test-dir build/sanitized --output-on-failure
      - name: The CMake package beeadhoc-core (find_package, swarm-core from its package; swarm-routing/.github#436)
        run: |
          prefix="$PWD/build/prefix"
          cmake -S build/debug/_deps/swarm_core_src-src/core -B build/swarm-core-pkg -DCMAKE_BUILD_TYPE=Release -DSWARM_CORE_TESTS=OFF
          cmake --build build/swarm-core-pkg -j "$(nproc)" && cmake --install build/swarm-core-pkg --prefix "$prefix"
          cmake -S core -B build/pkg -DCMAKE_BUILD_TYPE=Release -DBEEADHOC_CORE_SWARM_CORE_FROM_PACKAGE=ON \
            -DBEEADHOC_CORE_INSTALL=ON -DBEEADHOC_CORE_TESTS=OFF -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/pkg -j "$(nproc)" && cmake --install build/pkg --prefix "$prefix"
          for f in lib/libbeeadhoc_core.a lib/cmake/beeadhoc-core/beeadhoc-coreConfig.cmake lib/cmake/beeadhoc-core/beeadhoc-coreConfigVersion.cmake lib/cmake/beeadhoc-core/beeadhoc-coreTargets.cmake; do
            test -f "$prefix/$f" || { echo "::error::the install has no $f"; exit 1; }
          done
          cmake -S core/test/consumer-package -B build/consumer -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/consumer && build/consumer/consumer
      - name: Format (org .clang-format)
        run: git ls-files 'core/*.h' 'core/*.cc' | xargs clang-format-18 --style=file:.org/.clang-format --dry-run --Werror
