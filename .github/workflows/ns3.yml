name: ns-3

# The `beeadhoc` contrib module (ns3/, which compiles core/ as well) in
# ghcr.io/swarm-routing/ns3-dev (debug and sanitized, the release ns-3
# supports), on swarm-core `main` (swarm-core golden rule 12: protocols build
# against main), with every org quality gate swarm-core runs: strict warnings,
# coverage (report-only, to Codecov), SonarQube Cloud, determinism, clang-format
# and licence headers. routing-bench (swarm-routing/ns3-tools) is built beside
# it so the harness arm (ns3/helper/beeadhoc-bench-arms.cc) compiles and runs.
#
# core/ also builds alone against swarm-core at SWARM_CORE_REF (core.yml); the
# core-deps below name that same commit. The check that swarm-core main's core/
# is still the pinned one is `swarm-core / pin` (swarm-core-pin.yml, #46).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)
  workflow_dispatch:
    inputs:
      ns3-versions:
        description: 'On demand: JSON list of older ns-3 releases (3.42+), e.g. ["3.48"]'
        default: ''
      profiles:
        description: 'On demand: image profiles. Older releases have a debug image; a sanitized one only where it was built on request (e.g. 3.48). Never optimized: CI runs debug or sanitized only'
        type: choice
        options:
          - '["debug"]'
          - '["sanitized"]'
          - '["debug", "sanitized"]'
        default: '["debug"]'

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: swarm-routing/.github/.github/workflows/reusable-ns3-ci.yml@main
    with:
      modules: beeadhoc=ns3
      dependencies: |
        swarm-core=swarm-routing/ns3-swarm-core@main
        routing-bench=swarm-routing/ns3-tools@main:ns3/routing-bench
      ns3-versions: ${{ inputs.ns3-versions || '["latest"]' }}
      profiles: ${{ inputs.ns3-versions != '' && inputs.profiles || '["debug", "sanitized"]' }}
      # Older images may predate these options: automatic `latest` legs only.
      strict-warnings: ${{ inputs.ns3-versions == '' }}
      coverage: ${{ inputs.ns3-versions == '' }}
      sonar: ${{ inputs.ns3-versions == '' }}
      # The delivery smoke through the harness, as ns3-tools runs its stock arms.
      run: routing-compare --scenario=paper --nNodes=20 --time=30 --runs=1 --protocols=beeadhoc
      determinism: beeadhoc-example --seed={seed}
      dual-roots: 'core/ tools/'
      core-roots: 'core/'
      core-deps: swarm-routing/ns3-swarm-core@a8e5e1a7438656c920fb6bfa2164b7f3197b4a19:core
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The coverage report of the `ci` job to Codecov (report-only; GitHub OIDC).
  codecov:
    needs: ci
    if: inputs.ns3-versions == ''
    permissions:
      contents: read
      id-token: write
    uses: swarm-routing/.github/.github/workflows/reusable-codecov.yml@main

