name: ns-3

# The `beeadhoc` contrib module (ns3/, which compiles core/ as well) in
# ghcr.io/swarm-routing/ns3-dev (debug and sanitized, the release ns-3
# supports), on the swarm-core release swarm-core.lock names (its `main` in
# the canary leg), with every org quality gate swarm-core runs: strict warnings,
# coverage (report-only, to Codecov), SonarQube Cloud, determinism, clang-format
# and licence headers. routing-bench (swarm-routing/sim-tools) is built beside
# it so the harness arm (ns3/helper/beeadhoc-bench-arms.cc) compiles and runs.
#
# core/ also builds alone against the same swarm-core release, from its vcpkg
# port (core.yml; swarm-routing/.github#489). This module builds on the same release (the tag in `dependencies`,
# and in core-deps below); `canary-dependencies` builds on swarm-core and
# sim-tools main in one non-blocking leg on push, schedule and dispatch, never on
# a PR (swarm-routing/.github#411). The `swarm-core / pin` check keeps every tag
# on the lock's (swarm-routing/ns3-swarm-core#134).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)
  schedule:
    - cron: '17 4 * * 1'  # weekly: the canary leg on a quiet main
  workflow_dispatch:
    inputs:
      ns3-versions:
        description: 'On demand: JSON list of older ns-3 releases (3.42+), e.g. ["3.48"]'
        default: ''
      profiles:
        description: 'On demand: image profiles. Older releases have a debug image; a sanitized one only where it was built on request (e.g. 3.48). Never optimized: CI runs debug or sanitized only'
        type: choice
        options:
          - '["debug"]'
          - '["sanitized"]'
          - '["debug", "sanitized"]'
        default: '["debug"]'

permissions:
  contents: read
  packages: read

# A newer push to the same pull request cancels this run (swarm-routing/.github#505):
# runners are shared by the whole org. Pushes, merge groups and dispatches run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: swarm-routing/.github/.github/workflows/reusable-ns3-ci.yml@4f6ed3217d05ebccd2418617fdcd99ab7869de8e # main@2026-11-27
    with:
      modules: beeadhoc=ns3
      # released versions (swarm-routing/ns3-swarm-core#134); the moving refs in the
      # non-blocking canary leg, outside PRs (swarm-routing/.github#411)
      dependencies: |
        swarm-core=swarm-routing/swarm-adapter-ns3@v2.2.0
        routing-bench=swarm-routing/sim-tools@v1.1.4:ns3/routing-bench
      canary-dependencies: |
        swarm-core=swarm-routing/swarm-adapter-ns3@main
        routing-bench=swarm-routing/sim-tools@main:ns3/routing-bench
      ns3-versions: ${{ inputs.ns3-versions || '["latest"]' }}
      profiles: ${{ inputs.ns3-versions != '' && inputs.profiles || '["debug", "sanitized"]' }}
      # Automatic legs build in ns3-protocol-dev: swarm-core and routing-bench
      # prebuilt at the releases above, so only this module compiles
      # (swarm-routing/sim-containers#256); on-demand older releases keep ns3-dev.
      protocol-image: ${{ inputs.ns3-versions == '' }}
      # Older images may predate these options: automatic `latest` legs only.
      strict-warnings: ${{ inputs.ns3-versions == '' }}
      coverage: ${{ inputs.ns3-versions == '' }}
      sonar: ${{ inputs.ns3-versions == '' }}
      # The delivery smoke through the harness, as ns3-tools runs its stock arms.
      run: routing-compare --scenario=paper --nNodes=20 --time=30 --runs=1 --protocols=beeadhoc
      determinism: beeadhoc-example --seed={seed}
      dual-roots: 'core/ tools/'
      core-roots: 'core/'
      core-deps: swarm-routing/swarm-core@392e84d98cefd45db184d0788c264621f2e58192:core
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The coverage report of the `ci` job to Codecov (report-only; GitHub OIDC).
  codecov:
    needs: ci
    if: inputs.ns3-versions == ''
    permissions:
      contents: read
      id-token: write
    uses: swarm-routing/.github/.github/workflows/reusable-codecov.yml@4f6ed3217d05ebccd2418617fdcd99ab7869de8e # main@2026-11-27

