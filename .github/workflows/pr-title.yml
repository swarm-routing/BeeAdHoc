name: PR title

# The squash title is the commit on main: a lowercase Conventional Commit
# (swarm-routing/.github CONTRIBUTING.md).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions: {}

jobs:
  title:
    uses: swarm-routing/.github/.github/workflows/reusable-pr-title.yml@eb4464f60e7f9b2c5ef5f70c2d1c0f8119e0eddf # main@2026-11-24
