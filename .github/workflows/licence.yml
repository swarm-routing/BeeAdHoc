name: Licence

# core/ and tools/ are MIT OR GPL-2.0-only, and core/ includes only the C++
# standard library, other core/ files and swarm-core's dual-licensed core/ at
# the commit core/CMakeLists.txt pins (SWARM_CORE_REF; bump both together);
# everything else is GPL-2.0-only (LICENSING.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@main
    with:
      dual-roots: core/ tools/
      core-roots: core/
      core-deps: swarm-routing/ns3-swarm-core@ea0de23cc7d8e2b99ad9a6832c42d24c2f22a3bc:core
