name: Licence

# core/ and tools/ are MIT OR GPL-2.0-only, and core/ includes only the C++
# standard library and other core/ files; everything else is GPL-2.0-only
# (LICENSING.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@main
    with:
      dual-roots: core/ tools/
      core-roots: core/
