# org-sync configuration (swarm-routing/.github tools/org-sync).
kind = "protocol"
# CITATION.cff seed and cite badge. Once Zenodo archives a release: set zenodo_concept = "<record id>"
# (read from Zenodo), then `org_sync.py reseed CITATION.cff` so CITATION.cff names the DOI.
citation = true
# the Zenodo concept record (read from zenodo.org on 2026-11-11, v0.1.0 archived)
zenodo_concept = "24124821"
title = "BeeAdHoc"
dual = ["core/", "tools/"]
trust_boundary = """
The decoder of the scout header (`core/beeadhoc-scout.cc`, read in ns-3
through `ns3/model/beeadhoc-header.cc`), built on `swarm-core`'s
bounds-checked little-endian readers with roundtrip and seeded fuzz tests
(org invariant 3). It refuses a wrong version, an unknown mode, info bits
above 24, a route longer than `MaxHops` + 1 nodes, a short buffer or trailing
bytes. The core's two other decoders are built and tested the same way:
`decodeTrailer` (`core/beeadhoc-trailer.cc`, the data packet's source-route
trailer) and `decodeSwarm` (`core/beeadhoc-swarm.cc`), each with fail-closed
and seeded fuzz tests. The ns-3 adapter reads both from packets (#47): the
trailer on every data packet, the swarm as a control payload, each refused
when it does not decode."""
limitations = """
- **BeeAdHoc has no authentication** (Wedde & Farooq, 2005). Any node can forge
  scouts or foragers, and the battery and delay metrics they carry are
  self-reported, so a node can lie about its energy to attract or repel
  traffic. Out of scope; AntHocNet ADR-0020's default-off profile applies if a
  security profile is ever added.
- A simulation protocol for ns-3, not a network stack for real radios."""

[settings]
# GitHub settings as code: swarm-routing/.github tools/repo-settings (swarm-routing/.github#117).
description = "BeeAdHoc, the honeybee-inspired routing protocol of Wedde & Farooq (2005), as a standalone swarm routing protocol for MANETs: scouts, foragers and an energy metric, as a planned simulator-agnostic C++ core and ns-3 contrib module on swarm-core."
homepage = "https://swarm-routing.github.io/arena/BeeAdHoc/"
topics = ["beeadhoc", "bee-colony", "swarm-intelligence", "manet", "ad-hoc-routing", "routing-protocol", "energy-aware-routing", "ns-3", "network-simulation"]
ruleset = "protocol"
required_checks = ["check / org-sync", "title / title", "headers / licence", "core", "ci / ns-latest debug", "ci / ns-latest sanitized", "ci / format", "swarm-core / pin", "review / coderabbit"]
# Merge through a merge queue (swarm-routing/.github#130); every workflow behind a required
# check also runs on merge_group.
merge_queue = true

