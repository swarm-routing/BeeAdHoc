# The change-test smoke (#41): BeeAdHoc at a PR's head against its base, paired
# on identical seeds (org rule 6), in two families, 20 seeds each. Run it for
# any PR that changes core/ or ns3/ and put the verdicts in the PR.
#
# The cells are swarm-routing/ns3-tools' two-arm smoke cells
# (campaigns/anthocnet-aodv-smoke.toml: the paper grid under random waypoint,
# and the near-static mesh at pause 300 s), with beeadhoc alone in the harness and
# 20 seeds (1-20) in one job. Both arms run on ns3-dev 3.48-optimized
# (fb7596b) by digest: ns-3's release profile, the image the anchor runs on.
#
# For a PR: copy this plan, set `generation` to a new id and `pins` to the
# PR's base and head commits, then (ns3-tools checked out next to this repo):
#
#   P=tools/bench/campaigns/smoke.yaml
#   C="python3 ../ns3-tools/python/ns3_tool/campaign.py"   # or `ns3-campaign`
#   $C plan $P                                      # 4 jobs; dispatches nothing
#   $C dispatch $P --cap 4                          # re-run until all are dispatched
#   $C status $P                                    # every 15 min or so
#   G=$(python3 -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["generation"])' $P)
#   $C collect $P --out ".campaign/$G/cells"
#   grep -ho '\(swarm-core\|routing-bench\)@[0-9a-f]*' ".campaign/$G/cells"/*.txt | sort -u
#                                                   # 2 lines: one dependency set in every cell
#   $C verdicts $P --dir ".campaign/$G/cells"
#
# `verdicts` prints the paired 95 % CI of head minus base per cell
# (bench_parse --ab --proto beeadhoc). The pipeline was first proven on base
# 2bd8133 (#48) vs head 43b4611 (#65), generation smoke-43b4611 (PAIRED-NOISE in
# both cells, #41). The pins below are #108's merge commit (062d3cc: the core's
# trailer, foreign foragers, piggybacks and swarms in the adapter, expected to
# change every beeadhoc row) against its parent (7570629, #109: CI only).
generation: smoke-062d3cc
ref: main
repo: swarm-routing/BeeAdHoc
workflow: benchmark-cell.yml
program: routing-compare
cap: 4
control: base
image: ghcr.io/swarm-routing/ns3-dev@sha256:5585a93c5cea1980592539e2d26a4e111e0ff4b0cc63b3dfd6ea5de459d80d3f
pins:
  base: {source_sha: 757062940b21980de112292339d4978919fc0b57}
  head: {source_sha: 062d3cc81404bd5cb4b6b3605f4523830938dcbc}

arms:
  base: ""
  head: ""

cells:
  grid-rwp: {workflow: benchmark-cell.yml, inputs: {harness: routing-compare, args: "--scenario=paper --nNodes=50 --time=300 --areaX=1500 --areaY=300 --speed=20 --pause=30 --range=300 --propagation=range --mobility=rwp --transport=udp --diag --firstRun=1 --runs=20 --protocols=beeadhoc"}}
  static-mesh: {workflow: benchmark-cell.yml, inputs: {harness: routing-compare, args: "--scenario=paper --nNodes=50 --time=300 --areaX=1500 --areaY=300 --speed=20 --pause=300 --range=300 --propagation=range --mobility=rwp --transport=udp --diag --firstRun=1 --runs=20 --protocols=beeadhoc"}}

jobs:
  - {arms: [base, head], cells: "*"}
